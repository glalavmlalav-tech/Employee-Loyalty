<!doctype html>
<html lang="ku" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ستاف - بەڕێوەبردنی کارمەندان و مۆڵەت</title>
    <meta name="description" content="سیستەمی بەڕێوەبردن و داواکاری مۆڵەتی کارمەندان" />

    <script>
      // Suppress harmless Vite HMR WebSocket disconnect errors & console.error in AI Studio iframe preview environment
      (function() {
        var origError = console.error;
        console.error = function() {
          var text = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg instanceof Error) {
              text += ' ' + arg.message + ' ' + (arg.stack || '');
            } else {
              text += ' ' + String(arg);
            }
          }
          if (
            text.includes('WebSocket closed without opened') || 
            (text.includes('[vite]') && text.includes('WebSocket'))
          ) {
            return;
          }
          return origError.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          if (e && (
            (e.message && (e.message.includes('WebSocket') || e.message.includes('closed without opened'))) ||
            (e.filename && e.filename.includes('@vite/client'))
          )) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && String(e.reason).includes('WebSocket')) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
    
    <!-- PWA & Mobile Meta Tags for iPhone, iPad, and Android -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ستاف" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
