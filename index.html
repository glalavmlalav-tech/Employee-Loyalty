<!doctype html>
<html lang="ku" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ستاف - بەڕێوەبردنی کارمەندان و مۆڵەت</title>
    <meta name="description" content="سیستەمی بەڕێوەبردن و داواکاری مۆڵەتی کارمەندان" />

    <script>
      // Suppress Vite HMR WebSocket disconnect errors in AI Studio iframe preview environment
      (function() {
        var RealWebSocket = window.WebSocket;
        if (RealWebSocket) {
          function MockViteWebSocket(url, protocols) {
            var isViteHmr = false;
            if (protocols === 'vite-hmr' || (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1)) {
              isViteHmr = true;
            } else if (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('@vite') !== -1)) {
              isViteHmr = true;
            }

            if (!isViteHmr) {
              return new RealWebSocket(url, protocols);
            }

            var listeners = {};
            var wsObj = {
              url: url,
              protocol: 'vite-hmr',
              readyState: 1, // WebSocket.OPEN
              binaryType: 'blob',
              bufferedAmount: 0,
              extensions: '',
              send: function() {},
              close: function() {},
              addEventListener: function(type, fn) {
                if (!listeners[type]) listeners[type] = [];
                listeners[type].push(fn);
              },
              removeEventListener: function(type, fn) {
                if (!listeners[type]) return;
                listeners[type] = listeners[type].filter(function(cb) { return cb !== fn; });
              },
              dispatchEvent: function(event) {
                var cbs = listeners[event.type];
                if (cbs) {
                  for (var i = 0; i < cbs.length; i++) {
                    try { cbs[i].call(wsObj, event); } catch (e) {}
                  }
                }
                return true;
              }
            };

            ['open', 'message', 'error', 'close'].forEach(function(evt) {
              Object.defineProperty(wsObj, 'on' + evt, {
                get: function() { return (listeners[evt] && listeners[evt][0]) || null; },
                set: function(handler) {
                  listeners[evt] = handler ? [handler] : [];
                }
              });
            });

            setTimeout(function() {
              try {
                var ev = new Event('open');
                wsObj.dispatchEvent(ev);
                if (typeof wsObj.onopen === 'function') wsObj.onopen(ev);
              } catch (e) {}
            }, 0);

            return wsObj;
          }

          MockViteWebSocket.CONNECTING = 0;
          MockViteWebSocket.OPEN = 1;
          MockViteWebSocket.CLOSING = 2;
          MockViteWebSocket.CLOSED = 3;
          MockViteWebSocket.prototype = RealWebSocket.prototype;
          window.WebSocket = MockViteWebSocket;
        }

        var origError = console.error;
        console.error = function() {
          var text = '';
          for (var i = 0; i < arguments.length; i++) {
            var arg = arguments[i];
            if (arg instanceof Error) {
              text += ' ' + arg.message + ' ' + (arg.stack || '');
            } else {
              text += ' ' + String(arg);
            }
          }
          if (
            text.includes('WebSocket closed without opened') || 
            (text.includes('[vite]') && text.includes('WebSocket'))
          ) {
            return;
          }
          return origError.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          if (e && (
            (e.message && (e.message.includes('WebSocket') || e.message.includes('closed without opened'))) ||
            (e.filename && e.filename.includes('@vite/client'))
          )) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e && e.reason && String(e.reason).includes('WebSocket')) {
            e.stopImmediatePropagation();
            e.preventDefault();
          }
        }, true);
      })();
    </script>
    
    <!-- PWA & Mobile Meta Tags for iPhone, iPad, and Android -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ستاف" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
