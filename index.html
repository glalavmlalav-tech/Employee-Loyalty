<!doctype html>
<html lang="ku" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ستاف - بەڕێوەبردنی کارمەندان و مۆڵەت</title>
    <meta name="description" content="سیستەمی بەڕێوەبردن و داواکاری مۆڵەتی کارمەندان" />

    <script>
      // Suppress Vite dev HMR WebSocket disconnect errors in AI Studio iframe proxy
      (function() {
        try {
          var RealWebSocket = window.WebSocket;
          if (RealWebSocket) {
            class MockWebSocket extends RealWebSocket {
              constructor(url, protocols) {
                var isVite = (protocols === 'vite-hmr') ||
                  (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                  (typeof url === 'string' && (url.indexOf('vite-hmr') !== -1 || url.indexOf('@vite') !== -1));
                if (isVite) {
                  var dummy = {
                    url: String(url),
                    protocol: 'vite-hmr',
                    readyState: 1, // WebSocket.OPEN
                    bufferedAmount: 0,
                    extensions: '',
                    binaryType: 'blob',
                    onopen: null,
                    onmessage: null,
                    onerror: null,
                    onclose: null,
                    send: function() {},
                    close: function() {},
                    addEventListener: function(type, fn) {
                      if (type === 'open') {
                        setTimeout(function() {
                          try { fn(new Event('open')); } catch (e) {}
                        }, 0);
                      }
                    },
                    removeEventListener: function() {},
                    dispatchEvent: function() { return true; }
                  };
                  setTimeout(function() {
                    try {
                      if (typeof dummy.onopen === 'function') dummy.onopen(new Event('open'));
                    } catch (e) {}
                  }, 0);
                  return dummy;
                }
                super(url, protocols);
              }
            }
            window.WebSocket = MockWebSocket;
          }
        } catch (e) {}

        var origConsoleError = console.error;
        console.error = function() {
          var text = '';
          for (var i = 0; i < arguments.length; i++) {
            var a = arguments[i];
            if (a instanceof Error) {
              text += ' ' + (a.message || '') + ' ' + (a.stack || '');
            } else if (a !== null && a !== undefined) {
              text += ' ' + String(a);
            }
          }
          if (
            text.indexOf('closed without opened') !== -1 ||
            (text.indexOf('[vite]') !== -1 && text.indexOf('WebSocket') !== -1) ||
            text.indexOf('vite-hmr') !== -1
          ) {
            return;
          }
          return origConsoleError.apply(console, arguments);
        };

        window.addEventListener('error', function(e) {
          var msg = (e && e.message) ? String(e.message) : '';
          var fn = (e && e.filename) ? String(e.filename) : '';
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('closed without opened') !== -1 || fn.indexOf('@vite/client') !== -1) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = (e && e.reason) ? (e.reason.message || String(e.reason)) : '';
          if (reason.indexOf('WebSocket') !== -1 || reason.indexOf('closed without opened') !== -1) {
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            if (e.preventDefault) e.preventDefault();
          }
        }, true);
      })();
    </script>
    
    <!-- PWA & Mobile Meta Tags for iPhone, iPad, and Android -->
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ستاف" />

    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
